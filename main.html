<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SS THRESHER — MAINT TERMINAL 07</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --bg:#05070a;
  --green:#39ff88;
  --cyan:#4fd8ff;
  --red:#ff4d3d;
  --beige:#c9c2a3;
  --violet:#b967ff;
  --metal:#15181b;
  --metal-light:#262b2c;
  --ring-color:var(--cyan);
  --gold:#ffd76a;
  --glow-intensity:0;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; background:#000; overflow:hidden;}
body{font-family:'VT323', monospace; font-size:19px;}

/* ============ SPACE BACKDROP ============ */
#space{
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 15%, rgba(79,216,255,0.06), transparent 60%),
    radial-gradient(ellipse 50% 35% at 80% 75%, rgba(185,103,255,0.05), transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #0a0e14 0%, #020304 75%);
  z-index:0;
  overflow:hidden;
}
.star{
  position:absolute;
  background:#fff;
  animation:twinkle 3.2s ease-in-out infinite;
}
.star.bright{
  background:#b967ff;
  box-shadow:0 0 6px 2px rgba(185,103,255,0.5);
  animation:twinkle-blue 2.8s ease-in-out infinite;
}
.star.warm{
  background:#ffd76a;
  box-shadow:0 0 5px 1px rgba(255,215,106,0.4);
  animation:twinkle-warm 3.6s ease-in-out infinite;
}
.shooting-star{
  position:absolute;
  width:3px; height:3px;
  background:#fff;
  box-shadow:0 0 6px 3px rgba(255,255,255,0.6);
  border-radius:50%;
  animation:shoot 6s linear infinite;
  opacity:0;
}
@keyframes shoot{
  0%{opacity:0; transform:translate(0,0);}
  5%{opacity:1;}
  15%{opacity:0; transform:translate(-300px,300px);}
  100%{opacity:0;}
}
@keyframes twinkle{
  0%,100%{opacity:0.15; transform:scale(1);}
  50%{opacity:1; transform:scale(1.2);}
}
@keyframes twinkle-blue{
  0%,100%{opacity:0.1; transform:scale(1);}
  50%{opacity:0.9; transform:scale(1.4);}
}
@keyframes twinkle-warm{
  0%,100%{opacity:0.2; transform:scale(1);}
  50%{opacity:1; transform:scale(1.3);}
}
.nebula-drift{
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(circle at 30% 30%, rgba(79,216,255,0.05), transparent 35%),
    radial-gradient(circle at 70% 60%, rgba(185,103,255,0.04), transparent 40%);
  animation:driftbg 90s linear infinite alternate;
}
@keyframes driftbg{
  0%{transform:translate(0,0);}
  100%{transform:translate(-3%,2%);}
}

#stage{
  position:relative;
  z-index:2;
  width:100%;
  height:100vh;
  min-height:640px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#stage.shake{
  animation:screenshake 0.3s ease;
}
@keyframes screenshake{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-3px,2px);}
  40%{transform:translate(3px,-2px);}
  60%{transform:translate(-2px,3px);}
  80%{transform:translate(2px,-3px);}
}

/* ============ BEZEL / FRAME ============ */
.terminal{
  position:relative;
  width:min(1040px, 94vw);
  height:min(700px, 94vh);
  background:linear-gradient(160deg, var(--metal-light), var(--metal) 60%);
  padding:20px;
  box-shadow:
    0 0 0 3px #000,
    0 0 0 6px #2f3336,
    0 0 0 9px #000,
    0 25px 70px rgba(0,0,0,0.85);
  transition:box-shadow .3s ease;
}
.terminal.glow{
  box-shadow:
    0 0 0 3px #000,
    0 0 0 6px #2f3336,
    0 0 0 9px #000,
    0 0 40px rgba(57,255,136,0.15),
    0 25px 70px rgba(0,0,0,0.85);
}

.corner-bracket{
  position:absolute;
  width:22px; height:22px;
  border:3px solid #4a4f4c;
  z-index:5;
  transition:border-color .4s ease, box-shadow .4s ease;
}
.corner-bracket.tl{top:6px; left:6px; border-right:none; border-bottom:none;}
.corner-bracket.tr{top:6px; right:6px; border-left:none; border-bottom:none;}
.corner-bracket.bl{bottom:6px; left:6px; border-right:none; border-top:none;}
.corner-bracket.br{bottom:6px; right:6px; border-left:none; border-top:none;}
.corner-bracket.lit{
  border-color:var(--green);
  box-shadow:0 0 10px rgba(57,255,136,0.3);
}

.plate{
  position:absolute;
  top:2px; left:50%;
  transform:translateX(-50%);
  font-family:'Press Start 2P', monospace;
  font-size:8px;
  letter-spacing:1px;
  color:#8a8f8a;
  background:#0c0e0c;
  padding:5px 12px;
  border:2px solid #3a3f3a;
  z-index:6;
  white-space:nowrap;
  transition:color .5s ease, border-color .5s ease;
}
.plate.lit{
  color:var(--green);
  border-color:var(--green);
}

/* Operator ID badge (Kessler) - pinned to bezel */
.operator-badge{
  position:absolute;
  top:16px; left:16px;
  z-index:6;
  display:flex;
  align-items:center;
  gap:8px;
  background:#0c0e0c;
  border:2px solid #3a3f3a;
  padding:4px 8px 4px 4px;
  transition:border-color .4s ease;
}
.operator-badge.lit{
  border-color:var(--green);
}
.operator-badge img{
  width:30px; height:40px;
  object-fit:cover;
  object-position:top center;
  border:1px solid #4a4f4c;
}
.operator-badge .op-text{
  font-family:'Press Start 2P', monospace;
  font-size:7px;
  line-height:1.6;
  color:var(--green);
  letter-spacing:0.5px;
}
.operator-badge .op-text span{display:block; color:#6a7a6e; font-size:6px;}

/* ============ SCREEN ============ */
.screen{
  position:relative;
  width:100%;
  height:100%;
  background:var(--bg);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  border:2px solid #000;
}

.crt-overlay{
  position:absolute; inset:0; pointer-events:none; z-index:50;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 2px, transparent 3px, transparent 4px);
  mix-blend-mode:multiply;
  opacity:0.4;
  animation:scanlines 8s linear infinite;
}
@keyframes scanlines{
  0%{background-position:0 0;}
  100%{background-position:0 8px;}
}
.vignette{
  position:absolute; inset:0; pointer-events:none; z-index:51;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
}
.flicker{position:absolute; inset:0; pointer-events:none; z-index:52; background:#fff; opacity:0;}
.flicker.go{animation:flickerpulse 160ms ease-out;}
@keyframes flickerpulse{0%{opacity:0;}30%{opacity:0.07;}60%{opacity:0;}100%{opacity:0;}}
.static-glitch{
  position:absolute; inset:0; z-index:53; pointer-events:none; opacity:0;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 4px),
             repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 4px);
}
.static-glitch.go{animation:staticpulse 420ms steps(6);}
@keyframes staticpulse{0%,100%{opacity:0;}10%,30%,50%,70%{opacity:0.55;}20%,40%,60%,80%{opacity:0.12;}}

/* ============ CRT CURVATURE ============ */
.crt-curve{
  position:absolute; inset:0; pointer-events:none; z-index:49;
  border-radius:0;
  background: transparent;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
}
.screen:hover .crt-curve{
  box-shadow: inset 0 0 40px rgba(0,0,0,0.5), inset 0 0 80px rgba(57,255,136,0.02);
}

/* ============ PORTRAIT STAGE ============ */
.portrait-stage{
  position:absolute;
  left:12px;
  bottom:0;
  z-index:5;
  display:flex;
  align-items:flex-end;
  pointer-events:none;
}
.portrait-glow{
  position:absolute;
  bottom:10px; left:50%;
  width:260px; height:180px;
  transform:translateX(-40%);
  background:radial-gradient(ellipse at center, var(--ring-color), transparent 70%);
  opacity:0;
  filter:blur(10px);
  transition:opacity .8s ease, background .6s ease;
  pointer-events:none;
}
.portrait-glow.active{
  opacity:0.3;
}
.character-portrait{
  position:absolute;
  bottom:0; left:0;
  height:clamp(200px, 30vh, 340px);
  width:auto;
  object-fit:contain;
  image-rendering:pixelated;
  opacity:0;
  transition:opacity .5s ease, transform .5s ease, filter .5s ease;
  transform:translateY(15px) scale(0.95);
  filter:drop-shadow(0 10px 20px rgba(0,0,0,0.6));
}
.character-portrait.active{
  opacity:1;
  transform:translateY(0) scale(1);
}
#portraitDoss{
  z-index:2;
}
.character-portrait.breathe{
  animation:breathe 3.2s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-5px) scale(1.02);}
}
.character-portrait.offline{
  filter:grayscale(1) brightness(0.45) drop-shadow(0 8px 16px rgba(0,0,0,0.7));
}

/* ============ ARIA MODULE (top-right) ============ */
.aria-module{
  position:absolute;
  top:30px; right:10px;
  width:110px;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  transition:opacity .5s ease;
}
.aria-module.fade-out{
  opacity:0;
}
.ring-wrap{width:82px; height:82px; position:relative;}
.ring{
  width:100%; height:100%;
  border:3px solid var(--ring-color);
  transition:border-color .6s ease, filter .6s ease;
  filter:drop-shadow(0 0 8px var(--ring-color));
  animation:idlebreathe 3.4s ease-in-out infinite;
  clip-path:polygon(50% 0%, 85% 15%, 100% 50%, 85% 85%, 50% 100%, 15% 85%, 0% 50%, 15% 15%);
}
@keyframes idlebreathe{0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.05) rotate(3deg);}}
.ring.talking{
  animation:talkpulse 0.35s ease-in-out infinite !important;
  filter:drop-shadow(0 0 16px var(--ring-color));
}
@keyframes talkpulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.12);}}
.ring.unstable{
  clip-path:polygon(48% 2%, 82% 18%, 99% 47%, 88% 82%, 53% 98%, 17% 87%, 2% 53%, 18% 17%);
  animation:glitch-ring 0.15s ease-in-out infinite !important;
}
@keyframes glitch-ring{
  0%,100%{transform:scale(1) translate(0,0);}
  25%{transform:scale(1.03) translate(2px,-1px);}
  50%{transform:scale(0.97) translate(-2px,1px);}
  75%{transform:scale(1.02) translate(1px,2px);}
}
.ring.unstable .ring-inner-dot{animation:dot-glitch 0.2s infinite;}
@keyframes dot-glitch{
  0%,100%{opacity:1;}
  50%{opacity:0;}
}
.ring-inner-dot{
  position:absolute; top:50%; left:50%; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
  background:var(--ring-color); box-shadow:0 0 10px var(--ring-color);
  transition:background .3s ease;
}
.aria-status{
  font-family:'Press Start 2P', monospace;
  font-size:7px; letter-spacing:1px; color:var(--ring-color);
  text-align:center; opacity:0.9; min-height:26px; line-height:1.6;
  transition:color .5s ease;
}

/* ============ DIALOGUE PANEL (RPG style) ============ */
.dialogue-panel{
  position:relative;
  flex-shrink:0;
  min-height:150px;
  max-height:35vh;
  width:100%;
  background:rgba(44,38,33,0.92);
  border-top:3px solid #5a6a5e;
  padding:28px 60px 14px 150px;
  z-index:3;
  transition:opacity .3s ease, background .3s ease;
}
.dialogue-panel.narration{
  background:rgba(30,28,24,0.95);
}
.dialogue-panel.aria{
  background:rgba(20,28,36,0.92);
  border-top-color:var(--ring-color);
}
.dialogue-panel.comms{
  background:rgba(36,32,26,0.92);
  border-top-color:var(--beige);
}
.npc-name{
  font-family:'Press Start 2P', monospace;
  font-size:clamp(9px, 1.2vw, 13px);
  letter-spacing:2px;
  text-align:center;
  color:#7a8a9a;
  margin-bottom:6px;
  transition:color .3s ease;
  user-select:none;
}
.npc-name.highlight{
  color:var(--green);
}
.npc-name.aria-name{
  color:var(--ring-color);
  text-shadow:0 0 12px rgba(79,216,255,0.3);
}
.npc-name.doss-name{
  color:var(--beige);
}
.dialogue-text{
  font-size:clamp(18px, 2.2vw, 24px);
  line-height:1.45;
  color:#d4ccc0;
  text-align:center;
  white-space:pre-wrap;
  min-height:2.2em;
  max-height:10vh;
  overflow-y:auto;
  padding:0 10px;
  transition:color .3s ease;
}
.dialogue-text.aria-line{
  color:#b8d8f0;
  text-shadow:0 0 10px rgba(79,216,255,0.15);
}
.dialogue-text.doss-line{
  color:#d4c8b0;
}
.dialogue-text::-webkit-scrollbar{width:4px;}
.dialogue-text::-webkit-scrollbar-thumb{background:rgba(90,106,94,0.3); border-radius:2px;}
.cursor{
  display:inline-block; width:10px; height:1.1em; background:#d4ccc0; vertical-align:middle;
  margin-left:3px; animation:blink .7s steps(1) infinite;
}
.cursor.aria-cursor{background:var(--ring-color);}
.cursor.doss-cursor{background:var(--beige);}
@keyframes blink{50%{opacity:0;}}

/* ============ RPG DIALOGUE OPTIONS ============ */
.dialogue-options{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  margin-top:10px;
  padding:0 20px;
  flex-shrink:0;
}
.option{
  position:relative;
  background:transparent;
  border:none;
  border-bottom:2px solid transparent;
  padding:6px 10px 4px 10px;
  font-family:'Press Start 2P', monospace;
  font-size:clamp(8px, 1vw, 11px);
  letter-spacing:0.5px;
  color:#7a8a9a;
  cursor:pointer;
  text-align:center;
  transition:color .2s ease, border-color .2s ease, transform .2s ease, opacity .3s ease;
  width:100%;
  max-width:500px;
}
.option:hover:not(:disabled){
  color:#b0c0d0;
  border-bottom-color:rgba(90,106,94,0.4);
  transform:scale(1.02);
}
.option.active{
  color:#c8d8e8;
  border-bottom-color:#7a8a9a;
  transform:scale(1.03);
}
.option:disabled{cursor:default; opacity:0.4;}
.option.faded{opacity:0.1;}
.option.chosen{
  color:var(--green) !important;
  border-bottom-color:var(--green) !important;
  animation:option-snap 0.25s ease forwards;
}
@keyframes option-snap{
  0%{transform:scale(1.03);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1.03);}
}
.option.active .option-underline{
  width:100%;
}
.dialogue-options.hidden-el{display:none !important;}

/* ============ STATUS BAR ============ */
.status-bar{
  display:flex; gap:18px; padding:6px 24px;
  border-top:2px solid #2a2f2c;
  font-family:'Press Start 2P', monospace;
  font-size:clamp(7px, 0.8vw, 9px); letter-spacing:0.5px; color:#5a6a5e; flex-shrink:0;
  background:rgba(16,14,12,0.6);
  transition:opacity .5s ease, height .3s ease, padding .3s ease;
  justify-content:center;
}
.status-bar span b{color:var(--green); font-weight:normal; transition:color .3s ease;}
.status-bar span b.blink-danger{animation:blink-danger .6s steps(1) infinite;}
@keyframes blink-danger{50%{color:var(--red);}}
.status-bar.hidden{opacity:0; height:0; padding:0; overflow:hidden; border:none;}
.status-bar .hull-critical b{color:var(--red);}

/* ============ PARTICLE BURST ============ */
.particle{
  position:absolute; pointer-events:none;
  width:4px; height:4px;
  border-radius:50%;
  animation:particle-fly 0.8s ease-out forwards;
}
@keyframes particle-fly{
  0%{opacity:1; transform:translate(0,0) scale(1);}
  100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(0);}
}

/* Boot screen */
.boot-screen{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  font-size:20px; color:var(--green); letter-spacing:1px; text-align:center;
}
.boot-ring{
  width:60px; height:60px;
  border:3px solid var(--cyan);
  clip-path:polygon(50% 0%, 85% 15%, 100% 50%, 85% 85%, 50% 100%, 15% 85%, 0% 50%, 15% 15%);
  opacity:0; margin-top:18px; filter:drop-shadow(0 0 8px var(--cyan));
  animation:idlebreathe 3.4s ease-in-out infinite;
}

/* Ending screen */
.ending-screen{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; text-align:center; padding:30px;
}
.ending-ring{
  width:110px; height:110px;
  border:3px solid var(--ring-color);
  clip-path:polygon(50% 0%, 85% 15%, 100% 50%, 85% 85%, 50% 100%, 15% 85%, 0% 50%, 15% 15%);
  filter:drop-shadow(0 0 16px var(--ring-color));
  animation:idlebreathe 3.4s ease-in-out infinite;
  transition:border-color .6s ease;
}
.ending-text{
  max-width:540px; font-size:21px; line-height:1.55; color:var(--green);
  text-shadow:0 0 10px rgba(57,255,136,0.1);
}
.restart{
  margin-top:8px; background:#0c0e0c; border:2px solid #3a3f3a; color:#7a8a7e;
  font-family:'Press Start 2P', monospace; font-size:9px; letter-spacing:1px; padding:10px 16px; cursor:pointer;
  box-shadow:3px 3px 0 #000;
  transition:color .2s, border-color .2s, transform .15s, box-shadow .15s, background .2s;
}
.restart:hover{
  color:var(--green); border-color:var(--green);
  transform:translate(1px,1px); box-shadow:2px 2px 0 #000;
  background:#141a12;
}
.restart:active{
  transform:translate(2px,2px); box-shadow:1px 1px 0 #000;
}

.hidden-el{display:none !important;}
</style>
</head>
<body>

<div id="space"><div class="nebula-drift"></div></div>

<div id="stage">
  <div class="terminal">
    <div class="corner-bracket tl"></div>
    <div class="corner-bracket tr"></div>
    <div class="corner-bracket bl"></div>
    <div class="corner-bracket br"></div>
    <div class="plate">SS THRESHER — MAINT TERMINAL 07</div>
    <div class="operator-badge">
      <img src="1.png" alt="Kessler">
      <div class="op-text">OPERATOR<span>KESSLER</span></div>
    </div>

    <div class="screen" id="screen">
      <div class="crt-overlay"></div>
      <div class="crt-curve"></div>
      <div class="vignette"></div>
      <div class="flicker" id="flicker"></div>
      <div class="static-glitch" id="staticGlitch"></div>

      <!-- BOOT -->
      <div class="boot-screen" id="bootScreen">
        <div id="bootLines" style="min-height:90px;"></div>
        <div class="boot-ring" id="bootRing"></div>
      </div>

      <!-- MAIN SCENE UI -->
      <div id="mainUI" class="hidden-el" style="display:flex; flex-direction:column; height:100%; position:relative;">
        <div class="aria-module">
          <div class="ring-wrap">
            <div class="ring" id="ariaRing"><div class="ring-inner-dot"></div></div>
          </div>
          <div class="aria-status" id="ariaStatus">ARIA-9<br>STATUS: NOMINAL</div>
        </div>

        <div style="flex:1; min-height:0;"></div>

        <div class="portrait-stage">
          <div class="portrait-glow" id="portraitGlow"></div>
          <img class="character-portrait" id="portraitKessler" src="1.png" alt="Kessler">
          <img class="character-portrait" id="portraitDoss" src="2.png" alt="Doss">
        </div>

        <div class="dialogue-panel" id="dialoguePanel">
          <h2 class="npc-name" id="nameplate">SHIP LOG</h2>
          <div class="dialogue-text" id="dialogueText"></div>
          <div class="dialogue-options hidden-el" id="choices"></div>
        </div>

        <div class="status-bar" id="statusBar">
          <span>O2: <b id="o2Val">100%</b></span>
          <span class="hull-label">HULL: <b id="hullVal">NOMINAL</b></span>
          <span>PORT: <b id="timeVal">--:--</b></span>
          <span>SESSION: <b>KESSLER-07</b></span>
        </div>
      </div>

      <!-- ENDING -->
      <div class="ending-screen hidden-el" id="endingScreen">
        <div class="ending-ring" id="endingRing"></div>
        <div class="ending-text" id="endingText"></div>
        <button class="restart" id="restartBtn">◀ RUN DIAGNOSTIC AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- starfield generation ---------- */
(function(){
  const space = document.getElementById('space');
  for(let i=0;i<180;i++){
    const s = document.createElement('div');
    const r = Math.random();
    s.className = r < 0.7 ? 'star' : r < 0.85 ? 'star bright' : 'star warm';
    const size = Math.random() < 0.8 ? 1 : 2;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.top = (Math.random()*100)+'%';
    s.style.left = (Math.random()*100)+'%';
    s.style.animationDelay = (Math.random()*4)+'s';
    if(size===2 && r>0.85) s.style.boxShadow = '0 0 4px 1px rgba(255,215,106,0.6)';
    else if(size===2) s.style.boxShadow = '0 0 4px 1px rgba(185,103,255,0.5)';
    space.appendChild(s);
  }
  for(let i=0;i<3;i++){
    const ss = document.createElement('div');
    ss.className = 'shooting-star';
    ss.style.top = (5 + Math.random()*20)+'%';
    ss.style.left = (70 + Math.random()*25)+'%';
    ss.style.animationDelay = (2 + i*8 + Math.random()*4)+'s';
    space.appendChild(ss);
  }
})();

/* ===================== STATE ===================== */
let sceneIndex = 0;
let dossMet = false;
const colorMap = {cyan:"#4fd8ff", red:"#ff4d3d", violet:"#b967ff", unstable:"#4fd8ff", gold:"#ffd76a"};

const screenEl = document.getElementById('screen');
const bootScreen = document.getElementById('bootScreen');
const bootLines = document.getElementById('bootLines');
const bootRing = document.getElementById('bootRing');
const mainUI = document.getElementById('mainUI');
const portraitKessler = document.getElementById('portraitKessler');
const portraitDoss = document.getElementById('portraitDoss');
const portraitGlow = document.getElementById('portraitGlow');
const nameplate = document.getElementById('nameplate');
const dialogueText = document.getElementById('dialogueText');
const dialoguePanel = document.getElementById('dialoguePanel');
const ariaRing = document.getElementById('ariaRing');
const ariaStatus = document.getElementById('ariaStatus');
const choicesEl = document.getElementById('choices');
const statusBar = document.getElementById('statusBar');
const o2Val = document.getElementById('o2Val');
const hullVal = document.getElementById('hullVal');
const timeVal = document.getElementById('timeVal');
const flicker = document.getElementById('flicker');
const staticGlitch = document.getElementById('staticGlitch');
const endingScreen = document.getElementById('endingScreen');
const endingRing = document.getElementById('endingRing');
const endingText = document.getElementById('endingText');
const restartBtn = document.getElementById('restartBtn');
const stage = document.getElementById('stage');
const terminal = document.querySelector('.terminal');
const plate = document.querySelector('.plate');
const badge = document.querySelector('.operator-badge');
const corners = document.querySelectorAll('.corner-bracket');
const ariaModule = document.querySelector('.aria-module');

let selectedIdx = 0;
let choiceList = [];

function setRingColor(hex){ document.documentElement.style.setProperty('--ring-color', hex); }

function doFlicker(){
  flicker.classList.remove('go'); void flicker.offsetWidth; flicker.classList.add('go');
}
function maybeGlitch(){
  if(Math.random() < 1/12){
    staticGlitch.classList.remove('go'); void staticGlitch.offsetWidth; staticGlitch.classList.add('go');
  }
}
function doShake(){
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
}

function particleBurst(x, y, color){
  const count = 14;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI*2/count)*i + (Math.random()-0.5)*0.5;
    const dist = 30 + Math.random()*50;
    p.style.setProperty('--tx', Math.cos(angle)*dist+'px');
    p.style.setProperty('--ty', Math.sin(angle)*dist+'px');
    p.style.left = x+'px';
    p.style.top = y+'px';
    p.style.background = color || '#b0c0d0';
    p.style.boxShadow = '0 0 4px '+color;
    screenEl.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function litUI(){
  terminal.classList.add('glow');
  plate.classList.add('lit');
  badge.classList.add('lit');
  corners.forEach(c => c.classList.add('lit'));
  setTimeout(() => {
    terminal.classList.remove('glow');
    plate.classList.remove('lit');
    badge.classList.remove('lit');
    corners.forEach(c => c.classList.remove('lit'));
  }, 600);
}

function setPanelMode(mode){
  dialoguePanel.className = 'dialogue-panel';
  if(mode === 'narration') dialoguePanel.classList.add('narration');
  else if(mode === 'aria') dialoguePanel.classList.add('aria');
  else if(mode === 'comms') dialoguePanel.classList.add('comms');
}

function typeLine(el, text, speed, cb){
  el.innerHTML = "";
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  const isAria = nameplate.textContent === 'ARIA-9';
  const isDoss = nameplate.textContent === 'COMMS: DOSS';
  if(isAria) cursor.classList.add('aria-cursor');
  else if(isDoss) cursor.classList.add('doss-cursor');
  el.appendChild(cursor);
  function step(){
    if(Math.random() < 0.04 && i > 2){ i -= 2; doFlicker(); }
    if(i < text.length){
      cursor.insertAdjacentText('beforebegin', text[i]);
      i++;
      setTimeout(step, speed);
    } else {
      cursor.remove();
      if(cb) cb();
    }
  }
  step();
}

function showPortrait(who, offline){
  portraitKessler.classList.toggle('active', who === 'kessler');
  portraitDoss.classList.toggle('active', who === 'doss');
  portraitDoss.classList.toggle('offline', !!offline);
  portraitGlow.classList.toggle('active', who === 'kessler' || who === 'doss');
}

async function playBoot(){
  const lines = ["SS THRESHER — MAINTENANCE TERMINAL","BOOTING...","ARIA-9 LINKED.","...good morning, Kessler."];
  for(const l of lines){
    const div = document.createElement('div');
    div.style.marginBottom = "4px";
    bootLines.appendChild(div);
    await new Promise(res => typeLine(div, l, 22, res));
    await new Promise(res => setTimeout(res, 200));
  }
  bootRing.style.transition = "opacity 1.2s ease, transform 1.2s ease";
  bootRing.style.opacity = "1";
  bootRing.style.transform = "scale(1.3)";
  await new Promise(res => setTimeout(res, 1400));
  bootScreen.classList.add('hidden-el');
  mainUI.classList.remove('hidden-el');
  mainUI.style.display = "flex";
  doFlicker();
  litUI();
  loadScene(0);
}

function loadScene(idx){
  const s = scenes[idx];
  doFlicker();
  doShake();
  maybeGlitch();
  choicesEl.innerHTML = "";
  choicesEl.classList.add('hidden-el');
  ariaRing.className = "ring";
  selectedIdx = 0;
  choiceList = [];

  let moodHex = colorMap[s.mood] || colorMap.cyan;
  setRingColor(moodHex);
  if(s.mood === "unstable"){ ariaRing.classList.add("unstable"); }

  ariaModule.classList.remove('fade-out');
  if(s.noStatusBar){
    statusBar.classList.add('hidden');
  } else {
    statusBar.classList.remove('hidden');
    o2Val.textContent = s.o2 + "%";
    o2Val.classList.toggle('blink-danger', s.o2 < 30);
    hullVal.textContent = s.hull;
    hullVal.parentElement.classList.toggle('hull-critical', s.hull === "CRITICAL");
    if(s.hull === "CRITICAL") hullVal.classList.add('blink-danger');
    else hullVal.classList.remove('blink-danger');
    timeVal.textContent = s.time;
  }

  ariaStatus.innerHTML = "ARIA-9<br>STATUS: " + (s.mood === "red" ? "ALARMED" : s.mood === "unstable" ? "[EXPUNGED]" : "NOMINAL");
  showPortrait('kessler', false);

  const speed = s.typewriterSpeed || 35;

  async function playLines(){
    for(const line of s.lines){
      if(line.type === "narration"){
        setPanelMode('narration');
        nameplate.textContent = "SHIP LOG";
        nameplate.className = "npc-name highlight";
        dialogueText.className = "dialogue-text";
        showPortrait(null, false);
        await new Promise(res => typeLine(dialogueText, line.text, 22, res));
      } else if(line.type === "comms"){
        setPanelMode('comms');
        nameplate.textContent = "COMMS: DOSS";
        nameplate.className = "npc-name doss-name";
        dialogueText.className = "dialogue-text doss-line";
        showPortrait('doss', !!s.dossOffline);
        await new Promise(res => typeLine(dialogueText, line.text, 26, res));
      } else {
        setPanelMode('aria');
        nameplate.textContent = "ARIA-9";
        nameplate.className = "npc-name aria-name";
        dialogueText.className = "dialogue-text aria-line";
        showPortrait('kessler', false);
        if(s.silentOpen && s.lines.indexOf(line) === s.lines.length - 1){
          ariaRing.classList.remove("talking");
          await new Promise(res => setTimeout(res, 2000));
        }
        ariaRing.classList.add("talking");
        await new Promise(res => typeLine(dialogueText, line.text, speed, res));
        ariaRing.classList.remove("talking");
      }
      await new Promise(res => setTimeout(res, 500));
    }
    renderChoices(s);
  }
  playLines();
}

function renderChoices(s){
  choicesEl.innerHTML = "";
  choiceList = [];
  s.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = "option" + (i === 0 ? " active" : "");
    btn.textContent = choice.text;
    btn.dataset.index = i;
    btn.addEventListener('click', () => onChoose(choice, btn));
    btn.addEventListener('mouseenter', () => updateActiveOption(i));
    choicesEl.appendChild(btn);
    choiceList.push({ el: btn, data: choice });
  });
  choicesEl.classList.remove('hidden-el');
  selectedIdx = 0;
  setTimeout(() => {
    choiceList.forEach((c, i) => {
      c.el.style.opacity = '0';
      c.el.style.transform = 'translateY(6px)';
      setTimeout(() => {
        c.el.style.transition = 'opacity .3s ease, transform .3s ease';
        c.el.style.opacity = '1';
        c.el.style.transform = 'translateY(0)';
      }, i * 60);
    });
  }, 50);
}

function updateActiveOption(idx){
  choiceList.forEach((c, i) => {
    c.el.classList.toggle('active', i === idx);
  });
  selectedIdx = idx;
}

function onChoose(choice, btn){
  const rect = btn.getBoundingClientRect();
  choiceList.forEach(c => { c.el.disabled = true; });
  btn.classList.add('chosen');
  choiceList.forEach(c => { if(c.el !== btn) c.el.classList.add('faded'); });
  particleBurst(rect.left + rect.width/2, rect.top + rect.height/2, '#b0c0d0');
  doShake();
  litUI();
  setTimeout(() => {
    doFlicker();
    if(typeof choice.next === "number"){
      sceneIndex = choice.next;
      if(sceneIndex < scenes.length){ loadScene(sceneIndex); }
    } else {
      showEnding(choice.next);
    }
  }, 500);
}

function showEnding(key){
  mainUI.classList.add('hidden-el');
  mainUI.style.display = "none";
  endingScreen.classList.remove('hidden-el');
  endingScreen.style.display = "flex";
  const e = endings[key];
  setRingColor(e.color);
  endingRing.style.borderColor = e.color;
  endingRing.style.filter = "drop-shadow(0 0 24px " + e.color + ")";
  endingText.textContent = "";
  setTimeout(() => typeLine(endingText, e.text, 30), 400);
}

document.addEventListener('keydown', (e) => {
  if(choicesEl.classList.contains('hidden-el') || choiceList.length === 0) return;
  if(e.key === 'ArrowUp'){
    e.preventDefault();
    const prev = (selectedIdx - 1 + choiceList.length) % choiceList.length;
    updateActiveOption(prev);
  } else if(e.key === 'ArrowDown'){
    e.preventDefault();
    const next = (selectedIdx + 1) % choiceList.length;
    updateActiveOption(next);
  } else if(e.key === 'Enter'){
    e.preventDefault();
    const active = choiceList[selectedIdx];
    if(active && !active.el.disabled) onChoose(active.data, active.el);
  }
});

restartBtn.addEventListener('click', () => { location.reload(); });

setInterval(() => {
  if(!mainUI.classList.contains('hidden-el')) maybeGlitch();
}, 3000);

playBoot();
</script>
